[build]
  command = "npm install && npm run build"
  publish = "dist"
  ignore = "false"

# This is a Vite/React project - the @netlify/angular-runtime plugin
# configured in the UI should be removed from the Netlify UI settings.
# As a workaround, we ensure the build command and publish directory
# are correctly set for Vite.

[build.environment]
  # Ensure Node.js version compatibility
  NODE_VERSION = "20"

# Keep Lighthouse plugin if desired
[[plugins]]
  package = "@netlify/plugin-lighthouse"
